[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "himalayan-risk"
version = "1.0.0"
description = "Weather-aware imbalanced risk prediction on Himalayan expeditions"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
    {name = "Chinmaya Kumar Palo", email = "chinmayakumarpalo.official@gmail.com"},
    {name = "Tusharkanta Palo"},
    {name = "Himansu Sekhar Behera"},
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::FutureWarning", "ignore::UserWarning"]
